<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Öğrenci Kayıt Uygulaması</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 32px 16px;
      background: #f1f5f9;
      color: #1e293b;
      font-family: Arial, sans-serif;
    }

    main {
      max-width: 1050px;
      margin: auto;
    }

    h1 {
      margin-bottom: 8px;
    }

    .aciklama {
      color: #64748b;
      margin-bottom: 28px;
      line-height: 1.6;
    }

    .kart {
      background: white;
      padding: 24px;
      margin-bottom: 24px;
      border-radius: 14px;
      box-shadow: 0 4px 16px #00000008;
    }

    h2 {
      margin-top: 0;
      font-size: 21px;
    }

    .alanlar {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font: inherit;
    }

    input:focus {
      outline: 2px solid #2563eb;
      outline-offset: 2px;
    }

    .dugmeler {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      padding: 11px 16px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      filter: brightness(0.92);
    }

    button:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    .gri {
      background: #64748b;
    }

    .sil {
      background: #dc2626;
    }

    .tablo-kapsayici {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 14px 12px;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
    }

    th {
      background: #f8fafc;
    }

    td {
      overflow-wrap: anywhere;
    }

    .islemler {
      display: flex;
      gap: 8px;
    }

    #mesaj {
      padding: 14px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .basarili {
      background: #dcfce7;
      color: #166534;
    }

    .hata {
      background: #fee2e2;
      color: #991b1b;
    }

    #listeDurumu {
      color: #64748b;
    }

    footer {
      text-align: center;
      color: #64748b;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .alanlar {
        grid-template-columns: 1fr;
      }

      .kart {
        padding: 18px;
      }

      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>Öğrenci Kayıt Uygulaması</h1>

    <p class="aciklama">
      Öğrenci ekleyin, kayıtları görüntüleyin,
      bilgileri güncelleyin veya kayıtları silin.
    </p>

    <div id="mesaj" role="status" hidden></div>

    <section class="kart">
      <h2 id="formBasligi">Yeni öğrenci ekle</h2>

      <form id="ogrenciFormu">
        <div class="alanlar">
          <div>
            <label for="ad">Ad</label>
            <input id="ad" name="ad" maxlength="100" required>
          </div>

          <div>
            <label for="soyad">Soyad</label>
            <input id="soyad" name="soyad" maxlength="100" required>
          </div>

          <div>
            <label for="numara">Öğrenci numarası</label>
            <input
              id="numara"
              name="numara"
              maxlength="100"
              required
            >
          </div>

          <div>
            <label for="bolum">Bölüm</label>
            <input
              id="bolum"
              name="bolum"
              maxlength="100"
              required
            >
          </div>
        </div>

        <div class="dugmeler">
          <button id="kaydetButonu" type="submit">
            Öğrenci ekle
          </button>

          <button id="iptalButonu" type="button" class="gri" hidden>
            Düzenlemeyi iptal et
          </button>
        </div>
      </form>
    </section>

    <section class="kart">
      <h2>Öğrenci listesi</h2>
      <p id="listeDurumu">Kayıtlar yükleniyor...</p>

      <div class="tablo-kapsayici">
        <table aria-label="Kayıtlı öğrenciler">
          <thead>
            <tr>
              <th scope="col">Ad</th>
              <th scope="col">Soyad</th>
              <th scope="col">Numara</th>
              <th scope="col">Bölüm</th>
              <th scope="col">İşlemler</th>
            </tr>
          </thead>

          <tbody id="ogrenciListesi"></tbody>
        </table>
      </div>
    </section>

    <footer>
      Node.js · Express · MongoDB
    </footer>
  </main>

  <script>
    const form = document.getElementById("ogrenciFormu");
    const liste = document.getElementById("ogrenciListesi");
    const mesaj = document.getElementById("mesaj");
    const listeDurumu = document.getElementById("listeDurumu");
    const formBasligi = document.getElementById("formBasligi");
    const kaydetButonu = document.getElementById("kaydetButonu");
    const iptalButonu = document.getElementById("iptalButonu");

    const alanlar = ["ad", "soyad", "numara", "bolum"];

    // null ise yeni kayıt, bir kimlik varsa güncelleme yapılır.
    let duzenlenenId = null;
    let mesgul = false;

    function mesajGoster(yazi, hata = false) {
      mesaj.textContent = yazi;
      mesaj.className = hata ? "hata" : "basarili";
      mesaj.hidden = false;
    }

    // İşlem sürerken ikinci kez düğmeye basılmasını engeller.
    function mesgulAyarla(durum) {
      mesgul = durum;

      document.querySelectorAll("button, input").forEach((oge) => {
        oge.disabled = durum;
      });
    }

    // Sunucuyla iletişim kurar ve hata yanıtlarını kontrol eder.
    async function istekYap(adres, secenekler = {}) {
      const cevap = await fetch(adres, secenekler);
      const veri = await cevap.json();

      if (!cevap.ok) {
        throw new Error(veri.hata || "İşlem tamamlanamadı.");
      }

      return veri;
    }

    function formuTemizle() {
      duzenlenenId = null;
      form.reset();
      formBasligi.textContent = "Yeni öğrenci ekle";
      kaydetButonu.textContent = "Öğrenci ekle";
      iptalButonu.hidden = true;
    }

    // Seçilen öğrencinin bilgilerini forma taşır.
    function duzenle(ogrenci) {
      if (mesgul) return;

      duzenlenenId = ogrenci._id;

      for (const alan of alanlar) {
        document.getElementById(alan).value = ogrenci[alan];
      }

      formBasligi.textContent = "Öğrenci bilgilerini düzenle";
      kaydetButonu.textContent = "Değişiklikleri kaydet";
      iptalButonu.hidden = false;

      document.getElementById("ad").focus();
      form.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    // Veritabanındaki kayıtları getirip tabloya yerleştirir.
    async function ogrencileriGetir() {
      const ogrenciler = await istekYap("/api/ogrenciler");

      liste.replaceChildren();

      listeDurumu.textContent = ogrenciler.length === 0
        ? "Henüz öğrenci eklenmedi."
        : "Toplam " + ogrenciler.length + " öğrenci kayıtlı.";

      for (const ogrenci of ogrenciler) {
        const satir = document.createElement("tr");

        for (const alan of alanlar) {
          const hucre = document.createElement("td");

          // Kullanıcı bilgilerini HTML olarak değil, metin olarak gösterir.
          hucre.textContent = ogrenci[alan];
          satir.appendChild(hucre);
        }

        const islemHucresi = document.createElement("td");
        const dugmeler = document.createElement("div");
        dugmeler.className = "islemler";

        const duzenleButonu = document.createElement("button");
        duzenleButonu.type = "button";
        duzenleButonu.textContent = "Düzenle";
        duzenleButonu.disabled = mesgul;
        duzenleButonu.addEventListener("click", () => duzenle(ogrenci));

        const silButonu = document.createElement("button");
        silButonu.type = "button";
        silButonu.textContent = "Sil";
        silButonu.className = "sil";
        silButonu.disabled = mesgul;
        silButonu.addEventListener("click", () => ogrenciSil(ogrenci));

        dugmeler.append(duzenleButonu, silButonu);
        islemHucresi.appendChild(dugmeler);
        satir.appendChild(islemHucresi);
        liste.appendChild(satir);
      }
    }

    // Kayıt değiştikten sonra listeyi yeniden yükler.
    async function listeyiYenile() {
      try {
        await ogrencileriGetir();
      } catch (hata) {
        liste.replaceChildren();
        listeDurumu.textContent = "Güncel liste alınamadı.";
        mesajGoster(
          "İşlem kaydedildi, ancak liste yenilenemedi. Sayfayı yenileyin.",
          true
        );
      }
    }

    // Form gönderildiğinde ekleme veya güncelleme yapar.
    form.addEventListener("submit", async (olay) => {
      olay.preventDefault();
      if (mesgul) return;

      const bilgi = {};

      for (const alan of alanlar) {
        bilgi[alan] = document.getElementById(alan).value.trim();

        if (!bilgi[alan]) {
          mesajGoster("Lütfen tüm alanları doldurun.", true);
          return;
        }
      }

      const guncelleme = duzenlenenId !== null;

      const adres = guncelleme
        ? "/api/ogrenciler/" + duzenlenenId
        : "/api/ogrenciler";

      mesgulAyarla(true);

      try {
        const sonuc = await istekYap(adres, {
          method: guncelleme ? "PUT" : "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(bilgi),
        });

        formuTemizle();
        mesajGoster(sonuc.mesaj);
        await listeyiYenile();
      } catch (hata) {
        mesajGoster(hata.message, true);
      } finally {
        mesgulAyarla(false);
      }
    });

    // Kullanıcı onay verirse seçilen kaydı siler.
    async function ogrenciSil(ogrenci) {
      if (mesgul) return;

      const onay = confirm(
        ogrenci.ad + " " + ogrenci.soyad +
        " adlı öğrenciyi silmek istiyor musunuz?"
      );

      if (!onay) return;

      mesgulAyarla(true);

      try {
        const sonuc = await istekYap(
          "/api/ogrenciler/" + ogrenci._id,
          { method: "DELETE" }
        );

        if (duzenlenenId === ogrenci._id) {
          formuTemizle();
        }

        mesajGoster(sonuc.mesaj);
        await listeyiYenile();
      } catch (hata) {
        mesajGoster(hata.message, true);
      } finally {
        mesgulAyarla(false);
      }
    }

    iptalButonu.addEventListener("click", formuTemizle);

    async function baslat() {
      mesgulAyarla(true);

      try {
        await ogrencileriGetir();
      } catch (hata) {
        listeDurumu.textContent = "Öğrenci listesi yüklenemedi.";
        mesajGoster(
          "Sunucuya ulaşılamadı veya liste alınamadı: " + hata.message,
          true
        );
      } finally {
        mesgulAyarla(false);
      }
    }

    baslat();
  </script>
</body>
</html>
